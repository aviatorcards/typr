[project]
name = "typr"
version = "1.0.0"
description = "A terminal typing test"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
typr = "typr.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["typr*"]

[tool.setuptools.package-data]
typr = ["data/*.txt"]
